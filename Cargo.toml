[package]
name = "tv-text-import"
version = "0.1.0"
edition = "2024"
authors = ["Antoni Aloy"]
description = "A Text Import dialog for turbo-vision, after LibreOffice Calc's: character set, separators, quotes, number and date formats, and a typed column preview"
license = "MIT"
keywords = ["tui", "turbo-vision", "csv", "import"]
categories = ["command-line-interface", "parser-implementations"]

[dependencies]
# One copy of turbo-vision with the application: it patches this crates.io
# requirement with the fork's integration branch (frozen table panes,
# GroupBox, Unicode text input).
turbo-vision = "4.1.0"
# `Form` lives here, on the branch the application uses.
tv-extensions = { git = "https://github.com/aaloy/tv-extensions", branch = "feat/forms-edit-synced", features = ["native"] }
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
evalexpr = { version = "13", default-features = false }

[dev-dependencies]
turbo-vision = { version = "4.1.0", features = ["test-util"] }
